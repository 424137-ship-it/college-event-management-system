services:
  - type: web
    name: harshax-backend
    runtime: python
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1,.vercel.app"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.vercel.app,https://*.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: harshax-db
          property: connectionString

databases:
  - name: harshax-db
    databaseName: campusx_db
    user: harshax_user
    plan: free
