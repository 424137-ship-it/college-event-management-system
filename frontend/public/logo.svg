<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Metallic chrome gradient for H -->
    <linearGradient id="h-metal" x1="0.1" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="18%" stop-color="#F1F5F9" />
      <stop offset="38%" stop-color="#CBD5E1" />
      <stop offset="52%" stop-color="#E9D5FF" />
      <stop offset="72%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Metallic bevel facet for H -->
    <linearGradient id="h-facet" x1="0" y1="0" x2="1" y2="0.8">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#CBD5E1" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#475569" stop-opacity="0.7" />
    </linearGradient>

    <!-- Metallic outline edge -->
    <linearGradient id="h-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.5" />
    </linearGradient>

    <!-- Electric purple gradient for X -->
    <linearGradient id="x-purple" x1="0.1" y1="0.1" x2="0.9" y2="0.9">
      <stop offset="0%" stop-color="#E9D5FF" />
      <stop offset="22%" stop-color="#C084FC" />
      <stop offset="65%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#7E22CE" />
    </linearGradient>

    <!-- Cosmic swoosh luminous gradient -->
    <linearGradient id="swoosh-grad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.1" />
      <stop offset="20%" stop-color="#A855F7" />
      <stop offset="48%" stop-color="#C084FC" />
      <stop offset="72%" stop-color="#FFFFFF" />
      <stop offset="88%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7E22CE" stop-opacity="0.6" />
    </linearGradient>

    <!-- Wordmark HARSHA metallic navy gradient -->
    <linearGradient id="word-metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="45%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Wordmark X electric violet gradient -->
    <linearGradient id="word-x" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8B4FE" />
      <stop offset="40%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>

    <!-- Laser beam gradient -->
    <linearGradient id="beam-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0" />
      <stop offset="25%" stop-color="#A855F7" stop-opacity="0.5" />
      <stop offset="45%" stop-color="#C084FC" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#C084FC" stop-opacity="0.95" />
      <stop offset="75%" stop-color="#A855F7" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </linearGradient>

    <!-- Flare core glow -->
    <radialGradient id="flare-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#E9D5FF" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#A855F7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle soft shadow filter for contrast against white -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#17152B" flood-opacity="0.18" />
    </filter>

    <!-- Purple aura glow -->
    <filter id="purple-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#soft-shadow)">
    <!-- 1. EMBLEM (HX) -->
    <g id="hx-emblem" transform="translate(10, 0)">
      <!-- LETTER H -->
      <!-- Left Stem + Chamfer + Crossbar + Right Stem + Sharp Fangs -->
      <path d="M 194 70 
               L 232 70 
               L 202 135 
               L 262 135 
               L 292 70 
               L 330 70 
               L 266 208 
               L 250 242 
               L 226 214 
               L 238 188 
               L 178 188 
               L 166 214 
               L 134 242 
               L 150 208 
               L 176 152 
               L 168 85 
               Z" 
            fill="url(#h-metal)" 
            stroke="url(#h-edge)" 
            stroke-width="1.2" 
            stroke-linejoin="round" />

      <!-- Left Facet Highlight for 3D Bevel -->
      <path d="M 194 70 L 232 70 L 176 152 L 168 85 Z" fill="url(#h-facet)" opacity="0.6" />
      <!-- Right Facet Highlight for 3D Bevel -->
      <path d="M 292 70 L 330 70 L 280 178 L 262 135 Z" fill="url(#h-facet)" opacity="0.5" />

      <!-- LETTER X (Back Diagonal: Top-Right to Bottom-Left) -->
      <path d="M 398 70 
               L 436 70 
               L 340 238 
               L 302 238 
               Z" 
            fill="url(#x-purple)" />

      <!-- LETTER X (Front Diagonal: Top-Left to Bottom-Right) -->
      <path d="M 334 70 
               L 372 70 
               L 468 238 
               L 430 238 
               Z" 
            fill="url(#x-purple)" />

      <!-- X Center Facet Sheen -->
      <path d="M 374 125 L 406 125 L 392 165 L 360 165 Z" fill="#FFFFFF" opacity="0.25" />

      <!-- COSMIC ORBITAL SWOOSH LOOP -->
      <path d="M 132 242 
               C 188 238, 258 220, 318 195 
               C 373 172, 428 135, 463 95 
               C 488 65, 506 32, 483 22 
               C 458 12, 433 45, 408 80 
               C 438 45, 468 28, 483 35 
               C 498 42, 483 75, 453 110 
               C 413 155, 353 192, 293 218 
               C 228 245, 168 252, 132 242 
               Z" 
            fill="url(#swoosh-grad)" 
            filter="url(#purple-glow)" />

      <!-- Swoosh Inner Electric Core Line -->
      <path d="M 160 238 C 240 220, 340 180, 420 120 C 470 82, 495 42, 478 30" 
            stroke="#FFFFFF" 
            stroke-width="1.8" 
            stroke-linecap="round" 
            fill="none" 
            opacity="0.85" />
    </g>

    <!-- 2. "HARSHAX" WORDMARK -->
    <g id="wordmark" transform="translate(320, 335)">
      <!-- HARSHA in sleek dark navy chrome -->
      <text x="-40" y="0" 
            text-anchor="end" 
            font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Montserrat', 'Orbitron', sans-serif" 
            font-size="44" 
            font-weight="900" 
            letter-spacing="0.22em" 
            fill="url(#word-metal)">HARSHA</text>
      <!-- X in electric purple -->
      <text x="-18" y="0" 
            text-anchor="start" 
            font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Montserrat', 'Orbitron', sans-serif" 
            font-size="44" 
            font-weight="900" 
            letter-spacing="0.22em" 
            fill="url(#word-x)">X</text>
    </g>

    <!-- 3. HORIZON LASER FLARE BEAM -->
    <g id="laser-beam">
      <!-- Glow beam line -->
      <line x1="70" y1="368" x2="570" y2="368" stroke="url(#beam-grad)" stroke-width="2.5" />
      <!-- Central lens flare ellipse -->
      <ellipse cx="320" cy="368" rx="48" ry="4" fill="url(#flare-core)" />
      <!-- Luminous center point -->
      <circle cx="320" cy="368" r="3" fill="#FFFFFF" filter="url(#purple-glow)" />
    </g>
  </g>
</svg>